<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#FAF6F0;--warm:#F2EAE0;--brown:#7A4F35;
  --brown-mid:#A67855;--brown-light:#C9A880;--brown-dark:#4A2E1A;
  --text:#2C1A0E;--muted:#8B6B52;--white:#FFFFFF;
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);overflow-x:hidden}

/* LOADER */
#loader{position:fixed;inset:0;background:var(--brown-dark);z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s ease}
#loader.hide{opacity:0;pointer-events:none}
.loader-logo{font-family:'Cormorant Garamond',serif;font-size:3rem;color:var(--cream);font-weight:300;letter-spacing:4px;animation:fadeUp 1s ease both}
.loader-sub{font-size:.75rem;color:var(--brown-light);letter-spacing:3px;text-transform:uppercase;margin-top:6px;animation:fadeUp 1s ease .2s both}
.loader-tag{font-size:.85rem;color:var(--brown-light);letter-spacing:5px;text-transform:uppercase;margin-top:10px;animation:fadeUp 1s ease .3s both}
.loader-bar{width:180px;height:2px;background:rgba(255,255,255,.15);margin-top:40px;border-radius:2px;overflow:hidden}
.loader-fill{height:100%;width:0;background:var(--brown-light);animation:loadFill 2s ease forwards}
@keyframes loadFill{to{width:100%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* VISITOR GIFT / LEAD POPUP */
.gift-popup{position:fixed;inset:0;background:rgba(25,14,8,.62);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:14px;z-index:9100;overflow:auto}
.gift-popup.open{display:flex}
.gift-card{width:min(380px,100%);background:var(--cream);border:1px solid rgba(122,79,53,.14);border-radius:18px;box-shadow:0 24px 60px rgba(50,30,18,.32);padding:28px 24px 22px;position:relative;overflow:visible;margin:0;z-index:2}
.gift-card::before{display:none}

/* Premium camera + newborn film-roll burst above the popup.
   Decorative only: popup card, form and the rest of the website stay untouched. */
.gift-visual{position:absolute;left:50%;top:calc(50% - 390px);width:430px;height:280px;transform:translateX(-50%);z-index:3;pointer-events:none}
.gift-float{position:absolute;width:72px;height:88px;border:4px solid #f7ead9;border-radius:5px;background:#8b5b3c center/cover no-repeat;box-shadow:0 10px 18px rgba(30,16,8,.28);z-index:3;will-change:transform,opacity}
.gift-float.f1{left:74px;top:92px;transform:rotate(-15deg)}
.gift-float.f2{left:166px;top:30px;transform:rotate(8deg)}
.gift-float.f3{left:270px;top:76px;transform:rotate(15deg)}
.gift-float.f4{left:188px;top:132px;transform:rotate(-7deg)}
.gift-float.f5{left:12px;top:42px;width:50px;height:64px;transform:rotate(18deg);opacity:.72;filter:blur(1px)}
.gift-float.f6{left:350px;top:28px;width:50px;height:64px;transform:rotate(-12deg);opacity:.72;filter:blur(1px)}
.gift-spark{position:absolute;border-radius:50%;background:#f1c87e;box-shadow:0 0 16px rgba(224,179,108,.9);z-index:2}
.gift-spark.s1{width:8px;height:8px;left:145px;top:82px}.gift-spark.s2{width:5px;height:5px;left:235px;top:24px}
.gift-spark.s3{width:7px;height:7px;right:46px;top:112px}.gift-spark.s4{width:4px;height:4px;left:104px;top:22px}
.gift-spark.s5{width:6px;height:6px;left:255px;top:220px}.gift-spark.s6{width:4px;height:4px;left:38px;top:132px}

/* Floating newborn photo cards only — popup visual. */
.gift-popup.open .gift-visual{animation:photoBurstIn .85s cubic-bezier(.18,.78,.2,1) both}
.gift-popup.open .gift-float.f1{animation:photoFloat1 3.8s ease-in-out .1s infinite}
.gift-popup.open .gift-float.f2{animation:photoFloat2 4.2s ease-in-out .3s infinite}
.gift-popup.open .gift-float.f3{animation:photoFloat3 3.6s ease-in-out .5s infinite}
.gift-popup.open .gift-float.f4{animation:photoFloat4 4s ease-in-out .2s infinite}
.gift-popup.open .gift-float.f5{animation:photoFloat5 4.4s ease-in-out .4s infinite}
.gift-popup.open .gift-float.f6{animation:photoFloat6 3.9s ease-in-out .6s infinite}
.gift-popup.open .gift-spark{animation:sparkPulse 1.5s ease-in-out infinite}
@keyframes photoBurstIn{
  0%{opacity:0;transform:translateX(-50%) translateY(22px) scale(.9)}
  65%{opacity:1;transform:translateX(-50%) translateY(-5px) scale(1.02)}
  100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
}
@keyframes photoFloat1{50%{transform:translate(7px,-13px) rotate(-11deg)}}
@keyframes photoFloat2{50%{transform:translate(-5px,-10px) rotate(13deg)}}
@keyframes photoFloat3{50%{transform:translate(8px,8px) rotate(19deg)}}
@keyframes photoFloat4{50%{transform:translate(-8px,-7px) rotate(-13deg)}}
@keyframes photoFloat5{50%{transform:translate(-6px,-9px) rotate(23deg);opacity:.9}}
@keyframes photoFloat6{50%{transform:translate(7px,10px) rotate(-19deg);opacity:.9}}
@keyframes sparkPulse{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.45)}}
@media(prefers-reduced-motion:reduce){
  .gift-popup.open .gift-visual,.gift-popup.open .gift-float,.gift-popup.open .gift-spark{animation:none!important}
}

.gift-close{position:absolute;top:12px;right:14px;border:0;background:none;color:var(--brown-dark);font-size:1.5rem;line-height:1;cursor:pointer;padding:6px;z-index:8}
.gift-kicker{font-size:.6rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--brown-mid);margin-bottom:7px}
.gift-title{font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,4.5vw,2.25rem);font-weight:300;line-height:1.08;color:var(--brown-dark);margin-bottom:8px}
.gift-title em{font-style:italic;color:var(--brown)}
.gift-copy{font-size:.76rem;line-height:1.55;color:var(--muted);margin-bottom:13px}
.gift-highlight{background:var(--warm);border-left:3px solid var(--brown-light);border-radius:9px;padding:9px 11px;font-size:.7rem;line-height:1.45;color:var(--brown-dark);margin-bottom:12px}
.gift-form{display:grid;gap:8px}
.gift-input,.gift-select{width:100%;padding:9px 11px;border:1px solid #d9c9bc;border-radius:9px;background:#fff;color:var(--text);font:inherit;font-size:.78rem;outline:none}
.gift-input:focus,.gift-select:focus{border-color:var(--brown-mid)}
.gift-consent{display:flex;gap:7px;align-items:flex-start;font-size:.65rem;line-height:1.35;color:var(--muted);margin-top:1px}
.gift-consent input{margin-top:3px;accent-color:var(--brown)}
.gift-submit{border:0;background:var(--brown);color:#fff;padding:10px 15px;border-radius:30px;font-size:.7rem;letter-spacing:.8px;text-transform:uppercase;font-weight:500;cursor:pointer}
.gift-submit:hover{background:var(--brown-dark)}
.gift-status{font-size:.76rem;line-height:1.5;color:var(--muted);min-height:18px}
.gift-success{display:none;text-align:center}
.gift-success.open{display:block}
.gift-entry{font-family:'Cormorant Garamond',serif;font-size:2.3rem;color:var(--brown-dark);margin:10px 0 8px}
.gift-small{font-size:.75rem;line-height:1.6;color:var(--muted)}
.gift-continue{display:inline-block;margin-top:18px;text-decoration:none;color:var(--brown);border:1px solid var(--brown);padding:10px 18px;border-radius:30px;font-size:.78rem}
.gift-continue:hover{background:var(--brown);color:#fff}
.gift-popup.open .gift-kicker,
.gift-popup.open .gift-title,
.gift-popup.open .gift-copy,
.gift-popup.open .gift-highlight,
.gift-popup.open .gift-form{animation:none}
@keyframes giftContentIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){
  .gift-popup{padding:10px}
  .gift-card{width:min(340px,100%);padding:24px 18px 18px;margin:0}
  .gift-visual{top:calc(50% - 345px);width:320px;height:210px}
  .gift-float{width:52px;height:64px;border-width:3px}
  .gift-float.f1{left:45px;top:76px}.gift-float.f2{left:124px;top:25px}
  .gift-float.f3{left:213px;top:66px}.gift-float.f4{left:139px;top:120px}
  .gift-float.f5{left:7px;top:37px;width:39px;height:50px}.gift-float.f6{left:272px;top:23px;width:39px;height:50px}
  .gift-spark.s1{left:102px;top:68px}.gift-spark.s2{left:174px;top:18px}
  .gift-spark.s3{right:29px;top:93px}.gift-spark.s4{left:73px;top:18px}
  .gift-spark.s5{left:191px;top:166px}.gift-spark.s6{left:28px;top:110px}
