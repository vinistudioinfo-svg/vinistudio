<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViNi Studio — Gallery</title>
<meta name="description" content="ViNi Studio photography gallery.">
<link rel="icon" type="image/png" sizes="32x32" href="fevicon-32x32.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#FAF6F0;--warm:#F2EAE0;--brown:#7A4F35;--brown-mid:#A67855;--brown-light:#C9A880;--brown-dark:#4A2E1A;--text:#2C1A0E;--muted:#8B6B52;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--text);font-family:'DM Sans',sans-serif}
header{padding:28px 6vw 18px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:sticky;top:0;background:rgba(250,246,240,.96);backdrop-filter:blur(12px);z-index:5;border-bottom:1px solid rgba(122,79,53,.08)}
.brand{font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--brown-dark);text-decoration:none}.back{color:var(--brown);text-decoration:none;font-size:.8rem;letter-spacing:1px;text-transform:uppercase}
main{padding:55px 6vw 90px;max-width:1400px;margin:auto}.eyebrow{font-size:.7rem;letter-spacing:4px;text-transform:uppercase;color:var(--brown-mid)}h1{font:300 clamp(2.5rem,5vw,4.5rem)/1.05 'Cormorant Garamond',serif;color:var(--brown-dark);margin:10px 0 12px}h1 em{color:var(--brown)}.sub{color:var(--muted);max-width:620px;line-height:1.8;font-size:.9rem}
.status{text-align:center;color:var(--muted);padding:70px 10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:45px}.tile{border:0;padding:0;background:none;cursor:pointer;border-radius:14px;overflow:hidden;aspect-ratio:4/5;position:relative}.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}.tile:hover img{transform:scale(1.04)}
.empty{padding:70px 20px;text-align:center;color:var(--muted);border:1px dashed var(--brown-light);border-radius:18px;margin-top:40px}
.lightbox{display:none;position:fixed;inset:0;background:rgba(20,12,7,.94);z-index:20;align-items:center;justify-content:center;padding:24px}.lightbox.open{display:flex}.lightbox img{max-width:96vw;max-height:90vh;width:auto;height:auto;object-fit:contain}.close{position:absolute;right:22px;top:16px;background:none;border:0;color:#fff;font-size:2rem;cursor:pointer}.lbnav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:50%;width:48px;height:48px;font-size:1.4rem;cursor:pointer}.prev{left:18px}.next{right:18px}.count{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;font-size:.78rem;letter-spacing:1px}
@media(max-width:800px){header{padding:20px 5vw}.brand{font-size:1.6rem}main{padding:38px 5vw 70px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.tile{border-radius:10px}.lbnav{width:42px;height:42px}.prev{left:8px}.next{right:8px}}
@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><a class="brand" href="index.html">ViNi Studio</a><a class="back" href="index.html#services">← Back to Services</a></header>
<main>
<div class="eyebrow">ViNi Studio · Portfolio</div>
<h1 id="title">Our <em>Gallery</em></h1>
<p class="sub" id="subtitle">Moments captured with care — from tiny newborn details to beautiful family memories.</p>
<div id="status" class="status">Loading gallery…</div>
<div id="grid" class="grid" style="display:none"></div>
<div id="empty" class="empty" style="display:none">No photos have been added to this gallery yet.</div>
</main>
<div id="lightbox" class="lightbox" aria-hidden="true">
<button class="close" aria-label="Close">×</button><button class="lbnav prev" aria-label="Previous">‹</button><img id="lbimg" alt="ViNi Studio gallery photo"><button class="lbnav next" aria-label="Next">›</button><div id="count" class="count"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://qnkkrlixthefoyooizbe.supabase.co";
const SUPABASE_KEY="sb_publishable_7fkwoAKl0lMoMuIP-FnvAQ_zOZXMX0p";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const params=new URLSearchParams(location.search);
const category=(params.get('category')||'newborn').toLowerCase();
const names={newborn:'Newborn',maternity:'Maternity',kids:'Kids',family:'Family'};
const title=names[category]||'Gallery';
document.getElementById('title').innerHTML=title+' <em>Gallery</em>';
document.getElementById('subtitle').textContent='A collection of ViNi Studio '+title.toLowerCase()+' moments — viewed in high resolution.';
let photos=[],index=0;
function publicUrl(path){return client.storage.from('gallery').getPublicUrl(path).data.publicUrl}
function render(){
 const grid=document.getElementById('grid'),status=document.getElementById('status'),empty=document.getElementById('empty');
 status.style.display='none';
 if(!photos.length){empty.style.display='block';grid.style.display='none';return}
 empty.style.display='none';grid.style.display='grid';
 grid.innerHTML=photos.map((p,i)=>'<button class="tile" data-i="'+i+'"><img loading="lazy" src="'+publicUrl(p.image_path)+'" alt="'+title+' photography by ViNi Studio"></button>').join('');
 grid.querySelectorAll('.tile').forEach(b=>b.addEventListener('click',()=>openBox(+b.dataset.i)));
}
async function load(){
 const {data,error}=await client.from('gallery_photos').select('id,image_path,sort_order,created_at').eq('category',category).order('sort_order',{ascending:true}).order('created_at',{ascending:true});
 if(error){document.getElementById('status').textContent='Unable to load this gallery right now.';console.error(error);return}
 photos=data||[];render();
}
function openBox(i){index=i;document.getElementById('lbimg').src=publicUrl(photos[index].image_path);document.getElementById('count').textContent=(index+1)+' / '+photos.length;document.getElementById('lightbox').classList.add('open');document.getElementById('lightbox').setAttribute('aria-hidden','false')}
function move(n){if(!photos.length)return;index=(index+n+photos.length)%photos.length;openBox(index)}
document.querySelector('.close').onclick=()=>{document.getElementById('lightbox').classList.remove('open')};
document.querySelector('.prev').onclick=()=>move(-1);document.querySelector('.next').onclick=()=>move(1);
document.getElementById('lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')document.querySelector('.close').click()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('.close').click();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
load();
</script>
</body>
</html>
